<div class="relative inline-flex"
     x-data='storeProviderPopover({{ sidebar_store_subject_type|default("aweme")|tojson }}, {{ sidebar_project_id|tojson }})'
     x-init="load()"
     @mouseenter="show($el)"
     @mouseleave="scheduleClose()">
  <button type="button"
          class="inline-flex min-h-9 items-center gap-2 rounded-md border bg-white px-2.5 text-sm text-slate-700 shadow-sm hover:border-slate-300 hover:bg-slate-50 focus:outline-none focus:ring-2 focus:ring-slate-300"
          :class="cardClass"
          @click="window.dispatchEvent(new CustomEvent('open-store-picker', { detail: { subjectType: '{{ sidebar_store_subject_type|default('aweme') }}' } }))">
    <span class="relative grid size-6 shrink-0 place-items-center rounded-md bg-slate-100 text-slate-600">
      <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
        <ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
      </svg>
      <span class="absolute -bottom-0.5 -right-0.5 size-2.5 rounded-full border border-white"
            :class="statusDotClass"></span>
    </span>
    <span class="text-xs font-medium">{{ store_status_title|default("存储 Provider") }}</span>
    <span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-[11px] font-semibold text-slate-600"
          x-text="loading && !loaded ? '-' : selectedProviders.length"></span>
  </button>
  {% include "partials/store_provider_popover.html" %}
</div>
