<div x-data="workerRuntimeStatus()"
     x-init="init()"
     class="relative"
     @mouseenter="open=true"
     @mouseleave="open=false">
  <button type="button"
          class="group inline-flex min-h-10 cursor-pointer items-center gap-2 rounded-lg border bg-white px-3 text-left shadow-sm transition hover:border-slate-400"
          :class="statusCardClass"
          :disabled="busy"
          @focus="open=true"
          @click="handleClick()">
    <span class="size-2.5 shrink-0 rounded-full" :class="statusDotClass"></span>
    <span class="text-sm font-medium text-slate-700">Worker</span>
    <span class="text-xs font-semibold" :class="statusTextClass" x-text="statusLabel"></span>
    <span class="rounded-full bg-slate-900 px-2 py-0.5 text-xs font-semibold text-white"
          x-show="status && !isRunning && !busy">点击启动</span>
    <span class="rounded-full bg-slate-100 px-1.5 py-0.5 text-xs font-semibold text-slate-600"
          x-text="totalRatio"></span>
  </button>

  <div class="absolute left-0 top-10 z-40 h-3 w-[30rem]"
       x-cloak
       x-show="open"></div>
  <div class="absolute left-0 top-12 z-50 w-[min(30rem,calc(100vw-2rem))] rounded-xl border border-slate-200 bg-white p-4 text-sm shadow-xl"
       x-cloak
       x-show="open">
    <div class="mb-3 flex items-start justify-between gap-3">
      <div>
        <div class="font-semibold text-slate-900">后台采集调度</div>
        <div class="mt-0.5 text-xs text-slate-500" x-text="summaryText"></div>
      </div>
      <span class="size-2.5 shrink-0 rounded-full" :class="statusDotClass"></span>
    </div>

    <button type="button"
            class="mb-3 flex min-h-10 w-full items-center justify-center rounded-lg bg-slate-900 px-3 text-sm font-semibold text-white hover:bg-slate-700 disabled:cursor-not-allowed disabled:bg-slate-300"
            x-show="status && !isRunning"
            :disabled="busy"
            @click.stop="controlWorker('start')">
      启动后台采集调度
    </button>

    <div class="mb-3 flex flex-wrap gap-2">
      <button type="button"
              class="inline-flex min-h-8 items-center rounded-lg border border-slate-200 px-3 text-xs font-semibold text-slate-700 hover:border-slate-400 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300"
              :disabled="busy || !isRunning"
              @click.stop="controlWorker('stop')">
        停止
      </button>
      <button type="button"
              class="inline-flex min-h-8 items-center rounded-lg border border-slate-200 px-3 text-xs font-semibold text-slate-700 hover:border-slate-400 hover:bg-slate-50 disabled:cursor-not-allowed disabled:text-slate-300"
              :disabled="busy"
              @click.stop="controlWorker('restart')">
        重启
      </button>
      <span class="inline-flex min-h-8 items-center text-xs text-slate-400"
            x-show="busy"
            x-text="busyLabel"></span>
      <button type="button"
              class="inline-grid size-8 place-items-center rounded-lg border border-slate-200 text-slate-600 hover:border-slate-400 hover:bg-slate-50"
              title="Worker 调度日志"
              aria-label="Worker 调度日志"
              @click.stop="openLogs('worker')">
        <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
          <path d="M8 6h11M8 12h11M8 18h11"/>
          <path d="M4 6h.01M4 12h.01M4 18h.01"/>
        </svg>
      </button>
    </div>

    <div class="grid grid-cols-2 gap-2 text-xs">
      <div class="rounded-lg bg-slate-50 px-3 py-2">
        <div class="text-slate-400">主调度 PID</div>
        <div class="mt-1 font-medium text-slate-800" x-text="status?.pid || '-'"></div>
      </div>
      <div class="rounded-lg bg-slate-50 px-3 py-2">
        <div class="text-slate-400">心跳</div>
        <div class="mt-1 font-medium" :class="heartbeatClass" x-text="heartbeatText"></div>
      </div>
    </div>

    <div class="mt-3 rounded-lg border border-slate-100">
      <template x-for="item in taskRows" :key="item.key">
        <div class="flex items-center justify-between border-b border-slate-100 px-3 py-2 last:border-b-0">
          <div class="min-w-0">
            <span class="block truncate text-slate-600" x-text="item.label"></span>
          </div>
          <div class="flex shrink-0 items-center gap-2">
            <span class="rounded-full bg-slate-100 px-2 py-0.5 text-xs font-semibold text-slate-700"
                  x-text="`${item.running}/${item.limit}`"></span>
            <button type="button"
                    class="inline-grid size-7 place-items-center rounded-lg border border-slate-200 text-slate-500 hover:border-slate-400 hover:bg-slate-50"
                    :title="`${item.label}日志`"
                    :aria-label="`${item.label}日志`"
                    @click.stop="openTaskLogs(item)">
              <svg class="size-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true">
                <path d="M4 5h16v14H4z"/>
                <path d="M8 9h8M8 13h8M8 17h5"/>
              </svg>
            </button>
          </div>
        </div>
      </template>
    </div>

  </div>
</div>

<script>
function workerRuntimeStatus() {
  return {
    open: false,
    busy: false,
    status: null,
    timer: null,
    async init() {
      await this.refresh();
      this.timer = setInterval(() => this.refresh(), 5000);
    },
    async refresh() {
      try {
        const response = await fetch('/api/v1/worker-tasks/health', {
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error('无法读取 Worker 状态');
        this.status = await response.json();
      } catch (error) {
        this.status = {
          status: 'error',
          pid: null,
          running: 0,
          running_by_type: {},
          limits: {},
          heartbeat_stale: true,
          message: error.message
        };
      }
    },
    async handleClick() {
      this.open = true;
      if (!this.isRunning) await this.controlWorker('start');
    },
    async controlWorker(action) {
      if (this.busy) return;
      if (action === 'start' && this.isRunning) return;
      if (action === 'stop' && !this.isRunning) return;
      this.busy = action;
      try {
        const response = await fetch(`/api/v1/worker-tasks/${action}`, {
          method: 'POST',
          headers: { Accept: 'application/json' }
        });
        if (!response.ok) throw new Error(this.actionErrorText(action));
        await this.refresh();
      } catch (error) {
        this.status = {
          status: 'error',
          pid: null,
          running: 0,
          running_by_type: {},
          limits: {},
          heartbeat_stale: true,
          message: error.message
        };
      } finally {
        this.busy = null;
      }
    },
    openLogs(scope) {
      window.dispatchEvent(new CustomEvent('open-log-modal', {
        detail: {
          title: scope === 'tasks' ? 'Worker 任务日志' : 'Worker 调度日志',
          url: `/api/v1/worker-tasks/logs?scope=${encodeURIComponent(scope)}`
        }
      }));
    },
    openTaskLogs(item) {
      window.dispatchEvent(new CustomEvent('open-log-modal', {
        detail: {
          title: `${item.label}日志`,
          url: `/api/v1/worker-tasks/logs?scope=tasks&task_type=${encodeURIComponent(item.key)}`
        }
      }));
    },
    actionErrorText(action) {
      return {
        start: 'Worker 启动失败',
        stop: 'Worker 停止失败',
        restart: 'Worker 重启失败'
      }[action] || 'Worker 操作失败';
    },
    get isRunning() {
      return this.status?.status === 'running';
    },
    get isHeartbeatHealthy() {
      return this.isRunning && !this.status?.heartbeat_stale;
    },
    get runningCount() {
      return this.status?.running ?? 0;
    },
    get totalLimit() {
      const limits = this.status?.limits || {};
      return Object.values(limits).reduce((total, value) => total + Number(value || 0), 0);
    },
    get totalRatio() {
      return `${this.runningCount}/${this.totalLimit}`;
    },
    get statusLabel() {
      if (!this.status) return '检查中';
      if (this.status.status === 'error') return '异常';
      if (this.busy) return this.busyLabel;
      if (!this.isRunning) return '未运行';
      return this.isHeartbeatHealthy ? '运行中' : '心跳异常';
    },
    get busyLabel() {
      return {
        start: '启动中',
        stop: '停止中',
        restart: '重启中'
      }[this.busy] || '';
    },
    get summaryText() {
      if (!this.status) return '正在读取后台调度状态';
      if (this.status.status === 'error') return this.status.message || '状态读取失败';
      if (!this.isRunning) return '主调度未运行，点击 Worker 卡片或下方按钮启动';
      return `当前 ${this.runningCount}/${this.totalLimit} 个 Worker Task 运行中`;
    },
    get heartbeatText() {
      if (!this.isRunning) return '未运行';
      if (!this.status?.heartbeat_at) return '无心跳';
      const seconds = Math.round(this.status.heartbeat_age_seconds ?? 0);
      return this.status.heartbeat_stale ? `${seconds}s 前，异常` : `${seconds}s 前`;
    },
    get heartbeatClass() {
      if (!this.isRunning) return 'text-slate-500';
      return this.isHeartbeatHealthy ? 'text-emerald-700' : 'text-red-700';
    },
    get statusCardClass() {
      if (!this.status) return 'border-slate-200';
      if (!this.isRunning) return 'border-slate-200';
      return this.isHeartbeatHealthy ? 'border-emerald-200' : 'border-red-200';
    },
    get statusDotClass() {
      if (!this.status) return 'bg-slate-400';
      if (!this.isRunning) return 'bg-slate-400';
      return this.isHeartbeatHealthy ? 'bg-emerald-500' : 'bg-red-500';
    },
    get statusTextClass() {
      if (!this.status || !this.isRunning) return 'text-slate-500';
      return this.isHeartbeatHealthy ? 'text-emerald-700' : 'text-red-700';
    },
    get taskRows() {
      const counts = this.status?.running_by_type || {};
      const limits = this.status?.limits || {};
	      return [
	        ['data_collect', '数据采集'],
	        // V1.0 发布隐藏：评论采集暂不展示。
	        ['media_download', '媒体下载'],
	        ['video_transcription', '视频文字转写'],
	        ['data_sync', '数据同步']
      ].map(([key, label]) => ({
        key,
        label,
        running: counts[key] || 0,
        limit: limits[key] ?? 0
      }));
    }
  };
}
</script>
