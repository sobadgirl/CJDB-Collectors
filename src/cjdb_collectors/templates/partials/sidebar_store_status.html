{% set sidebar_subject_type = sidebar_subject_type|default(sidebar_store_subject_type|default("aweme")) %}
<span class="ml-auto shrink-0 cursor-pointer"
      x-data='storeProviderPopover({{ sidebar_subject_type|tojson }}, {{ sidebar_project_id|tojson }})'
      x-init="load()"
      role="button"
      tabindex="0"
      title="配置存储 Provider"
      @click.stop.prevent="window.dispatchEvent(new CustomEvent('open-store-picker', { detail: { subjectType: '{{ sidebar_subject_type }}' } }))"
      @keydown.enter.stop.prevent="window.dispatchEvent(new CustomEvent('open-store-picker', { detail: { subjectType: '{{ sidebar_subject_type }}' } }))"
      @mouseenter.stop="show($el)"
      @mouseleave.stop="scheduleClose()">
  <span class="relative grid size-7 place-items-center rounded-md {% if request.url.path == active_path or (active_path == '/awemes' and request.url.path == '/') %}bg-white/10 text-white{% else %}bg-slate-100 text-slate-500 group-hover:bg-white{% endif %}"
        aria-label="存储 Provider">
    <svg class="size-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
      <ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v6c0 1.7 3.1 3 7 3s7-1.3 7-3V5"/><path d="M5 11v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>
    </svg>
    <span class="absolute -bottom-0.5 -right-0.5 size-2.5 rounded-full border border-white"
          :class="statusDotClass"></span>
  </span>
  {% include "partials/store_provider_popover.html" %}
</span>
