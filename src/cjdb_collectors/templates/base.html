<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}超级对标 Connectors{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css">
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>[x-cloak] { display: none !important; }</style>
</head>
<body class="min-h-screen bg-[#f6f7f9] text-base-content"
      x-data="{ groupCreateOpen: false, sidebarOpen: false }">
  <div class="flex min-h-screen">
    <aside class="fixed inset-y-0 left-0 z-50 flex h-screen w-72 shrink-0 -translate-x-full flex-col border-r border-slate-200 bg-white px-4 py-5 shadow-xl transition-transform lg:sticky lg:top-0 lg:translate-x-0 lg:shadow-none"
           :class="{ 'translate-x-0': sidebarOpen }">
      <a class="mb-7 flex items-center gap-3 px-2" href="/">
        <span class="grid size-9 place-items-center rounded-xl bg-slate-900 text-sm font-bold text-white">CJ</span>
        <span>
          <span class="block text-sm font-semibold leading-5 text-slate-900">超级对标</span>
          <span class="block text-xs text-slate-400">Collectors</span>
        </span>
      </a>

      <nav class="min-h-0 flex-1 space-y-2" aria-label="主要功能">
        <a href="/"
           class="group flex min-h-14 items-center gap-3 rounded-xl px-3 transition-colors
                  {% if request.url.path == '/' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-700 hover:bg-slate-100{% endif %}">
          <span class="grid size-9 place-items-center rounded-lg {% if request.url.path == '/' %}bg-white/10{% else %}bg-slate-100 group-hover:bg-white{% endif %}">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M4 6.5 12 3l8 3.5-8 3.5-8-3.5Z"/><path d="m4 11 8 3.5 8-3.5M4 15.5 12 19l8-3.5"/>
            </svg>
          </span>
          <span>
            <span class="block text-sm font-semibold">数据采集</span>
            <span class="block text-xs {% if request.url.path == '/' %}text-white/60{% else %}text-slate-400{% endif %}">作品与账号</span>
          </span>
        </a>
        {% block sidebar_groups %}{% endblock %}
        <a href="/transcriptions"
           class="group flex min-h-14 items-center gap-3 rounded-xl px-3 transition-colors
                  {% if request.url.path == '/transcriptions' %}bg-slate-900 text-white shadow-sm{% else %}text-slate-700 hover:bg-slate-100{% endif %}">
          <span class="grid size-9 place-items-center rounded-lg {% if request.url.path == '/transcriptions' %}bg-white/10{% else %}bg-slate-100 group-hover:bg-white{% endif %}">
            <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
              <path d="M7 4h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="m10 9 5 3-5 3V9Z"/>
            </svg>
          </span>
          <span>
            <span class="block text-sm font-semibold">视频转写</span>
            <span class="block text-xs {% if request.url.path == '/transcriptions' %}text-white/60{% else %}text-slate-400{% endif %}">音视频转文字</span>
          </span>
        </a>
      </nav>

      <a href="/settings"
         class="mt-4 flex min-h-11 items-center gap-3 rounded-xl px-3 text-sm font-medium transition-colors
                {% if request.url.path == '/settings' %}bg-slate-100 text-slate-900{% else %}text-slate-500 hover:bg-slate-100 hover:text-slate-900{% endif %}">
        <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.37.3.72.6 1 .3.28.68.42 1.1.4h.09v4h-.09a1.7 1.7 0 0 0-1.7.6Z"/>
        </svg>
        系统设置
      </a>
    </aside>

    <div class="min-w-0 flex-1">
      <header class="sticky top-0 z-30 flex h-16 items-center justify-between border-b border-slate-200 bg-white px-4 lg:hidden">
        <button type="button" class="btn btn-ghost btn-square" aria-label="打开导航" @click="sidebarOpen=true">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path d="M4 7h16M4 12h16M4 17h16"/>
          </svg>
        </button>
        <a class="text-sm font-semibold text-slate-900" href="/">超级对标</a>
        <a class="btn btn-ghost btn-square" href="/settings" aria-label="系统设置">
          <svg class="size-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.09A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.09A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.09A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.1.37.3.72.6 1 .3.28.68.42 1.1.4h.09v4h-.09a1.7 1.7 0 0 0-1.7.6Z"/>
          </svg>
        </a>
      </header>
      <main>{% block content %}{% endblock %}</main>
    </div>
  </div>
  <button type="button" class="fixed inset-0 z-40 bg-slate-950/35 lg:hidden"
          x-cloak x-show="sidebarOpen" aria-label="关闭导航" @click="sidebarOpen=false"></button>

  <div class="modal" :class="{ 'modal-open': groupCreateOpen }">
    <div class="modal-box max-w-md">
      <h3 class="text-lg font-bold">创建分组</h3>
      <p class="mt-1 text-sm text-slate-500">用分组整理不同主题的采集内容。</p>
      <form method="post" action="/actions/groups" class="mt-5 space-y-4">
        <input type="hidden" name="next_url" value="/">
        <label class="form-control">
          <span class="label-text mb-1.5">分组名称</span>
          <input class="input input-bordered w-full" name="name" required maxlength="80" autofocus>
        </label>
        <label class="form-control">
          <span class="label-text mb-1.5">标识颜色</span>
          <input class="h-11 w-full cursor-pointer rounded-lg border border-base-300 bg-white p-1.5" type="color" name="color" value="#64748b">
        </label>
        <div class="modal-action">
          <button type="button" class="btn btn-ghost" @click="groupCreateOpen=false">取消</button>
          <button class="btn bg-slate-900 text-white hover:bg-slate-700">创建分组</button>
        </div>
      </form>
    </div>
    <div class="modal-backdrop" @click="groupCreateOpen=false"></div>
  </div>
  <script>
    document.addEventListener('submit', async (event) => {
      const form = event.target.closest('form[data-async-list-action]');
      if (!form) return;

      event.preventDefault();
      const target = document.querySelector('#data-list');
      if (!target) {
        form.submit();
        return;
      }

      const submitter = event.submitter;
      if (submitter) submitter.disabled = true;
      try {
        const response = await fetch(form.action, {
          method: form.method || 'POST',
          body: new FormData(form),
          headers: { 'HX-Request': 'true' },
          credentials: 'same-origin'
        });
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        target.innerHTML = await response.text();
        if (window.htmx) window.htmx.process(target);
      } finally {
        if (submitter) submitter.disabled = false;
      }
    });
  </script>
</body>
</html>
