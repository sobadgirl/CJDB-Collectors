[project]
name = "cjdb-collectors"
version = "0.1.0"
description = "Local-first benchmark content collection, transcription, and synchronization tool."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16.0,<2",
    "fastapi>=0.116.0,<1",
    "httpx>=0.28.0,<1",
    "jinja2>=3.1.0,<4",
    "notion-client>=2.4.0,<3",
    "pydantic>=2.11.0,<3",
    "psutil>=7.0.0,<8",
    "python-multipart>=0.0.20,<1",
    "pyyaml>=6.0.0,<7",
    "rich>=13.0.0,<16",
    "sqlmodel>=0.0.24,<1",
    "typer>=0.16.0,<1",
    "uvicorn[standard]>=0.35.0,<1",
]

[project.optional-dependencies]
transcription = [
    "faster-whisper>=1.1.0,<2",
    "funasr>=1.3.29,<2",
    "imageio-ffmpeg>=0.6,<1",
    "socksio>=1.0,<2",
    "torch",
    "torchaudio",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0,<9",
    "ruff>=0.12.0,<1",
]

[project.scripts]
cjdb = "cjdb_collectors.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cjdb_collectors"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
